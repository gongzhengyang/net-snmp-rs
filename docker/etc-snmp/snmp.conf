# net-snmp-rs client tool defaults (snmpget, snmpwalk, ...).
#
# Read from the standard search path via SNMPCONFPATH=/etc/snmp inside the
# container. Any explicit command-line flag (-v / -c / -m ...) overrides these.

# Default to SNMPv2c with the `public` community so the tools can be invoked
# without repeating -v/-c on every line.
defVersion   2c
defCommunity public

# Where to look for textual MIB files (optional; built-in names still resolve).
mibdirs /usr/share/snmp/mibs
