[workspace]
resolver = "2"
members = [
    "crates/netsnmp",
    "crates/netsnmp-agent",
    "crates/netsnmp-apps",
    "crates/netsnmp-itest",
    "examples",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
authors = ["gongzhengyangfindyourdream@gmail.com"]
repository = "https://github.com/gongzhengyang/net-snmp"
description = "A pure-Rust reimplementation of the Net-SNMP protocol stack"

[workspace.dependencies]
netsnmp = { path = "crates/netsnmp", version = "1.0.0" }
netsnmp-agent = { path = "crates/netsnmp-agent", version = "1.0.0" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
itertools = "0.14"
futures = "0.3"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
rasn = "0.28"
rasn-smi = "0.28"
rasn-snmp = "0.28"

[profile.release]
lto = true
strip = true
