# net-snmp-rs agent (snmpd) configuration.
#
# Read from the standard search path via SNMPCONFPATH=/etc/snmp inside the
# container. Command-line options passed to `snmpd` override these values.

# Read-only community used by the SNMPv1/v2c client tools.
rocommunity public

# System group scalars (sysContact / sysName / sysLocation are writable).
syscontact  "ops <ops@example.com>"
syslocation "Docker container (net-snmp-rs)"

# Listen on every interface, default SNMP port. The compose service publishes
# this as the hostname `snmpd` on the internal network.
agentAddress udp:161

# An SNMPv3 USM user (authPriv) so the v3 integration checks have something to
# authenticate against: SHA auth + AES privacy.
createUser bob SHA authpassword AES privpassword
